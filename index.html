<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R Karthick | Cyber Security Specialist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00ffcc;
      --secondary: #0088ff;
      --bg-dark: #050b14;
      --card-bg: rgba(10, 20, 38, 0.85);
      --text-glow: 0 0 10px rgba(0, 255, 204, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fira Code', monospace;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.05) 0%, transparent 60%),
        linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      perspective: 1200px;
      overflow: hidden;
    }

    .card-container {
      width: 480px;
      height: 280px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card-container:hover {
      transform: rotateY(180deg);
    }

    .side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 204, 0.3);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 204, 0.1);
      overflow: hidden;
    }

    /* Cyber Chip Decor */
    .side::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: scanline 3s linear infinite;
    }

    /* Front Side */
    .front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      width: fit-content;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: var(--text-glow);
    }

    .identity h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .identity .title {
      color: var(--primary);
      font-size: 13px;
      margin-top: 4px;
      font-weight: 600;
    }

    .specialties {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      font-size: 10px;
      color: #666;
    }

    /* Back Side */
    .back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 204, 0.2);
      padding-bottom: 8px;
    }

    .back-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: #d1d5db;
    }

    .info-item i {
      color: var(--primary);
      font-size: 14px;
      width: 16px;
      text-align: center;
    }

    .info-item a {
      color: #d1d5db;
      text-decoration: none;
      transition: color 0.3s;
    }

    .info-item a:hover {
      color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-links {
      display: flex;
      gap: 8px;
    }

    .social-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.3);
      color: var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: all 0.3s;
    }

    .social-btn:hover {
      background: var(--primary);
      color: var(--bg-dark);
      box-shadow: var(--text-glow);
    }

    .whatsapp-btn {
      flex: 1;
      height: 34px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.3);
      transition: all 0.3s;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.6);
    }

    @keyframes scanline {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>

      <div class="actions">
        <div class="social-links">
          <a href="https://linkedin.com/in/mr-karthick" target="_blank" class="social-btn"><i class="fab fa-linkedin-in"></i></a>

        <a href="https://wa.me/6303350725" target="_blank" class="whatsapp-btn">

        </a>
      </div>
    </div>
  </div>

</body>
</html>
