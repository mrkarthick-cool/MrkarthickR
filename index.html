<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mrkarthick | Cybersecurity vCard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f2027;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      perspective: 1000px;
    }
    .card {
      width: 450px;
      height: 250px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s;
    }
    .card:hover {
      transform: rotateY(180deg);
    }
    .side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    .front {
      background: linear-gradient(135deg, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: glow 3s infinite alternate;
    }
    .front h1 {
      font-size: 26px;
      margin: 0;
      text-shadow: 0 0 15px #00e0ff;
    }
    .front p {
      margin: 8px 0;
      font-size: 14px;
    }
    .back {
      background: #111;
      color: #eee;
      transform: rotateY(180deg);
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .back h2 {
      margin: 0 0 10px;
      color: #00e0ff;
    }
    .back p {
      margin: 5px 0;
      font-size: 14px;
    }
    .links a {
      display: inline-block;
      margin: 8px;
      font-size: 20px;
      color: #00e0ff;
      transition: transform 0.3s, color 0.3s;
    }
    .links a:hover {
      transform: scale(1.3);
      color: #ff4081;
    }
    .whatsapp {
      margin-top: 15px;
      display: inline-block;
      padding: 10px 20px;
      background: #25D366;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s, transform 0.3s;
    }
    .whatsapp:hover {
      background: #128C7E;
      transform: scale(1.1);
    }
    @keyframes glow {
      from { box-shadow: 0 0 15px #00e0ff; }
      to { box-shadow: 0 0 35px #00e0ff; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Front Side -->
    <div class="side front">
      <h1>Mrkarthick</h1>
      <p>Cybersecurity Researcher</p>
      <p>Cyber Awareness & Web Penetration Testing</p>
    </div>
    <!-- Back Side -->
    <div class="side back">
      <h2>Contact Info</h2>
      <p>Email: <a href="mailto:mrkarthick246@gmail.com">mrkarthick246@gmail.com</a></p>
      <p>Location: Lakahmipuram Village,<br>Varadaiahpalem Mandal,<br>Tirupati District, Andhra Pradesh 517541</p>
      <div class="links">
        <a href="https://linkedin.com/in/mr-karthick" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/mrkarthick-cool" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://cyberwarriorsociety.blogspot.com/2025/11/t.m.html" target="_blank"><i class="fas fa-blog"></i></a>
      </div>
      <a class="whatsapp" href="https://wa.me/6303350725" target="_blank"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>
    </div>
  </div>
</body>
</html>
