<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mrkarthick | Cybersecurity vCard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .vcard {
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 350px;
      text-align: center;
      animation: fadeInUp 1.5s ease;
    }
    .vcard h1 {
      margin: 0;
      font-size: 24px;
      color: #00e0ff;
    }
    .vcard p {
      margin: 8px 0;
      font-size: 14px;
    }
    .links a {
      display: inline-block;
      margin: 8px;
      text-decoration: none;
      color: #00e0ff;
      transition: transform 0.3s;
    }
    .links a:hover {
      transform: scale(1.2);
      color: #ff4081;
    }
    .whatsapp {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #25D366;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    .whatsapp:hover {
      background: #128C7E;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

      <a href="https://cyberwarriorsociety.blogspot.com/2025/11/t.m.html" target="_blank">Blog</a>
